# The esp-sdr software radio. The Wi-Fi driver brings the radio up at boot;
# nothing may scan or connect.
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
CONFIG_NET_RX_STACK_SIZE=1024
CONFIG_NET_L2_WIFI_SHELL=n

CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_RX_DECIM=n
CONFIG_ESP_SDR_TX=y
CONFIG_ESP_SDR_TX_DAC=y
CONFIG_ESP_SDR_TX_DAC_HIGH_RAM=y
CONFIG_ESP_SDR_IEEE802154=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y

# Internal RAM: two dump banks. The Wi-Fi heap goes to the octal PSRAM.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8
CONFIG_ESP32_WIFI_EVENT_TASK_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
# Peak 15464 bytes measured with CONFIG_SYS_HEAP_RUNTIME_STATS (`wpan mem`).
CONFIG_HEAP_MEM_POOL_SIZE=16128

# USB device on the OTG port: shell on CDC-ACM, DFU with sysbuild/MCUboot.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR 802.15.4"
CONFIG_SAMPLE_USBD_PID=0x0005
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_DWC2_STACK_SIZE=1280
CONFIG_USBD_CDC_ACM_CLASS=y
# CDC-ACM carries the console and the shell: its own logging must stay off (it would log to
# itself), which usbd_cdc_acm.c otherwise enforces with a #warning that -Werror makes fatal.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_LOG_BACKEND_UART=n
# Measured high-water marks (`kernel thread stacks`) under traffic: shell 1952 of 2048,
# logging 544 of 1024 with frame printing off, ISR stacks 512 of 2048. Frame printing
# (`wpan set print 1`) runs in the logging thread, the shell backend in the shell thread.
CONFIG_SHELL_STACK_SIZE=2560
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
# Twice the measured 512 (80 % rule): room in the image for the PSRAM-safe atomics
# and the ACK path's priority change (IRAM).
CONFIG_ISR_STACK_SIZE=1024
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=256
CONFIG_KERNEL_SHELL=y

CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_APP_LIVENESS_WATCHDOG=y

# 802.15.4 packet fields for the software radio, without the L2.
CONFIG_IEEE802154=y
CONFIG_NET_L2_IEEE802154=n

# Gapless receive: three dump banks, so the DRAM image ends below 0x3fcb0000.
CONFIG_ESP_SDR_RING=y
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=6
CONFIG_NET_BUF_TX_COUNT=1
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_LOG_BUFFER_SIZE=448
CONFIG_SHELL_CMD_BUFF_SIZE=96
CONFIG_SHELL_HISTORY=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n


# CDC-ACM waits forever for the host to take a notification, which it only
# does while the port is open: off the system work queue, which feeds the
# liveness watchdog. The idle stacks (288 B used) pay for its stack.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_USBD_CDC_ACM_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=512
CONFIG_NET_BUF_DATA_SIZE=96
CONFIG_BASE64=y
CONFIG_HWINFO=y
