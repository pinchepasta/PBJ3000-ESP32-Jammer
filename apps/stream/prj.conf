# The Wi-Fi driver brings the radio up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y

CONFIG_ESP_SDR=y
# Deferred logging: immediate mode formats on the caller's stack, which
# overflows the small USB driver thread stacks.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Float statistics on the process thread.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_MAIN_STACK_SIZE=2048

# Capture on CPU 0 next to the Wi-Fi task, process on CPU 1.
CONFIG_SMP=y

CONFIG_LIBVRT=y

# USB device on the OTG port (DFU with sysbuild/MCUboot).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR"
CONFIG_SAMPLE_USBD_PID=0x0005
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_DWC2_STACK_SIZE=1280

# USB network (CDC-NCM) carrying the VRT stream as UDP over IPv6.
CONFIG_USBD_CDC_NCM_CLASS=y
# Room for 5 full datagrams per OUT NTB: the host aggregates them into one
# transfer (USB full speed moves a limited number of transfers per second).
CONFIG_USBD_CDC_NCM_RECV_NTB_MAX_SIZE=8192
CONFIG_USBD_CDC_NCM_MAX_DGRAM_PER_NTB=5
# Uplink: up to 3 datagrams per IN NTB, collected while one is in flight.
CONFIG_USBD_CDC_NCM_SEND_NTB_MAX_SIZE=4608
CONFIG_USBD_CDC_NCM_SEND_MAX_DGRAM_PER_NTB=3
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# Receive timeout for the transmit socket (idle stop).
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=32
# Receive buffers for the host's transmit stream (1500 byte datagrams).
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=48
# "net stats" in the shell.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y

# Console and Zephyr shell on a USB CDC-ACM port; the shell log backend
# carries the logs, so the UART backend would only duplicate them.
CONFIG_USBD_CDC_ACM_CLASS=y
# CDC-ACM carries the console and the shell: its own logging must stay off (it would log to
# itself), which usbd_cdc_acm.c otherwise enforces with a #warning that -Werror makes fatal.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_LOG_BACKEND_UART=n
# Lean shell: net, kernel and mcuboot commands only.
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=256
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_DEVMEM_SHELL=n
# Wi-Fi management commands would also retune the radio under the receiver.
CONFIG_NET_L2_WIFI_SHELL=n

# 8 MB octal PSRAM: transmit waveform ring (EXT_RAM_BSS_ATTR).
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# Heap statistics for `sdr mem` (sizing internal RAM).
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Internal RAM diet: two 64 KiB dump banks must fit (capture and DAC ping-pong).
# Sizes from `sdr mem` and `kernel thread stacks` after a TX and RX run.
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8
CONFIG_ESP32_WIFI_EVENT_TASK_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
CONFIG_APP_RX_BURSTS=2
CONFIG_ESP_SDR_TX_DAC_STACK_SIZE=1024
# Internal system heap: peak 15.5 KB measured with the Wi-Fi heap in PSRAM.
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=20480
