sample:
  name: ESP-SDR stream
  description: >-
    Burst I/Q capture on both cores, VITA 49.2 packets as UDP over IPv6 on a
    USB CDC-NCM link, USB DFU through MCUboot, Zephyr shell on USB CDC-ACM
common:
  tags: esp-sdr
  sysbuild: true
  platform_allow:
    - xiao_esp32s3/esp32s3/procpu
  integration_platforms:
    - xiao_esp32s3/esp32s3/procpu
tests:
  # The console is on USB CDC-ACM, which twister cannot reach over
  # USB-Serial-JTAG: run it with tools/vrt_rx.py instead (see README).
  sample.esp_sdr.stream:
    build_only: true
