# The Wi-Fi driver brings the radio up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
CONFIG_ESP_SDR=y

CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Loadable extensions, code and data in PSRAM heaps; the code runs at its
# instruction bus alias (src/apps.c).
CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_DYNAMIC=y
CONFIG_LLEXT_EXEC_ALIAS=y
# Every global of an extension, not only EXPORT_SYMBOL()s: the host finds the
# hooks an app defines by name (app_usb_dfu_prepare()).
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=y
# The host exports exactly what its extensions import (exports.py, group MULTIAPP).
CONFIG_LLEXT_EXPORT_DEFAULT_GROUPS=n
CONFIG_LLEXT_LOG_LEVEL_ERR=y

# What the apps need from the host: capture's float output, rfprobe's dumps.
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_BASE64=y
