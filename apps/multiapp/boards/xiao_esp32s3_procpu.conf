# SMP and octal PSRAM as the apps that run on both cores (stream, link,
# osmosdr, wpan); the Wi-Fi heap goes to PSRAM.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_SMP=y
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
# The network and Wi-Fi drivers' stacks and packet pools too: internal RAM
# is for the dump banks.
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_SCHED_CPU_MASK=y
# The apps use the radio, not Wi-Fi traffic: the fewest static receive buffers
# (about 1.6 KB of system heap each), so no A-MPDU receive, whose window may be
# at most twice their number.
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=2
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=8
CONFIG_ESP32_WIFI_EVENT_TASK_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
# Peak 12216 bytes in every app (`kernel heap`), nearly all of it the Wi-Fi driver's.
CONFIG_HEAP_MEM_POOL_SIZE=13312
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_RESET_ON_FATAL_ERROR=y
# A hung app resets the board instead of needing a replug; "app crash" tells.
CONFIG_APP_LIVENESS_WATCHDOG=y

# USB device on the OTG port: shell on CDC-ACM, DFU with sysbuild/MCUboot.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_PRODUCT="ESP-SDR multiapp"
CONFIG_SAMPLE_USBD_PID=0x0005
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_CLASS=y
# CDC-ACM carries the console and the shell: its own logging must stay off
# (doc/testing.md: usbd_cdc_acm.c's #warning is fatal under twister).
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=256
CONFIG_HWINFO=y

# The radio as wpan uses it: transmit through the DAC, the gapless receive ring
# (three dump banks: the DRAM image must end below 0x3fcb0000) and the
# 802.15.4 software radio without the L2.
CONFIG_ESP_SDR_TX=y
CONFIG_ESP_SDR_TX_DAC=y
CONFIG_ESP_SDR_TX_DAC_HIGH_RAM=y
CONFIG_ESP_SDR_RING=y
CONFIG_ESP_SDR_IEEE802154=y
# Its buffers live in the area osmosdr's boots use instead (src/apps.c).
CONFIG_ESP_SDR_IEEE802154_HIGH_RAM_APP=y
CONFIG_IEEE802154=y
CONFIG_NET_L2_IEEE802154=n
CONFIG_NET_L2_WIFI_SHELL=n

# Internal RAM for the three banks: stacks sized for an 80 % peak with every app
# exercised (`kernel thread stacks`, `app info`, `app crash`).
CONFIG_NET_RX_STACK_SIZE=1024
# Peak 1120 (radio init), in every boot.
CONFIG_MAIN_STACK_SIZE=1536
# Peak 880 (stream).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1152
# Peak 288.
CONFIG_IDLE_STACK_SIZE=384
# Peak 560.
CONFIG_ISR_STACK_SIZE=768
# The apps' commands run here: link's need 2.3 KB (ofdm bench), as its own.
CONFIG_SHELL_STACK_SIZE=3072
# Peak 544.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=704
# Peak 688.
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=896
CONFIG_LOG_BUFFER_SIZE=448
CONFIG_SHELL_CMD_BUFF_SIZE=96
CONFIG_SHELL_HISTORY=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
# Peak 1008, in a DFU download (it writes the flash).
CONFIG_USBD_THREAD_STACK_SIZE=1280
# Peak 528.
CONFIG_UDC_DWC2_STACK_SIZE=704
# Peak 640.
CONFIG_USBD_CDC_ACM_STACK_SIZE=832
# llext links the whole kernel; nothing here sends mailbox messages.
CONFIG_NUM_MBOX_ASYNC_MSGS=0

# stream's USB profile: VITA 49.2 over UDP/IPv6 on CDC-NCM, with the
# network pools the stream app sizes (in PSRAM, see above). The NCM endpoint
# buffers live in bank 0 (multiapp_bank0.ld).
CONFIG_LIBVRT=y
CONFIG_USBD_CDC_NCM_CLASS=y
CONFIG_USBD_CDC_NCM_RECV_NTB_MAX_SIZE=8192
CONFIG_USBD_CDC_NCM_MAX_DGRAM_PER_NTB=5
CONFIG_USBD_CDC_NCM_SEND_NTB_MAX_SIZE=4608
CONFIG_USBD_CDC_NCM_SEND_MAX_DGRAM_PER_NTB=3
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_SHELL=y
# Two sockets on one link: fewer contexts and neighbours than the defaults.
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_IPV6_MAX_NEIGHBORS=4

# The apps as files on a FAT volume (src/drive.c): read only, by the host,
# before USB starts; long names (".llext" is not 8.3), one file at a time.
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_NUM_FILES=1
CONFIG_FS_FATFS_NUM_DIRS=1
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=32
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FLASHDISK_LOG_LEVEL_WRN=y
CONFIG_FS_LOG_LEVEL_WRN=y
# The app files' CRC (crc32_ieee()).
CONFIG_CRC=y
# The volume as a USB drive in boots without an app: one SCSI buffer (in
# bank 0), the thread writes the flash so its stack stays internal (peak 880).
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_DOUBLE_BUFFERING=n
CONFIG_USBD_MSC_STACK_SIZE=1152
CONFIG_USBD_MSC_LOG_LEVEL_WRN=y
