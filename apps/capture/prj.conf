# The Wi-Fi driver brings the radio up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y

CONFIG_ESP_SDR=y
# Immediate mode keeps log lines from splitting the printf output.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Float statistics and FFT on the main thread (hardware FPU: boards/).
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_MAIN_STACK_SIZE=4096
